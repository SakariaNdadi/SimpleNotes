<!DOCTYPE html>
<html lang="en" data-palette="default">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Notes{% endblock %}</title>
  <!-- Apply saved palette before page renders to avoid flash -->
  <script>
    (function(){
      var p = localStorage.getItem('notes-palette') || 'default';
      document.documentElement.setAttribute('data-palette', p);
      var tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
      if (tz) document.cookie = 'tz=' + tz + ';path=/;max-age=31536000;SameSite=Lax';
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="/static/tailwind.min.js"></script>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/alpinejs.min.js" defer></script>
</head>
<body class="bg-app text-primary font-sans antialiased">
  {% if impersonating %}
  <div class="fixed top-0 inset-x-0 z-[9999] bg-red-600 text-white text-center py-1.5 text-sm font-medium flex items-center justify-center gap-3">
    <span>Impersonating <strong>{{ user.username }}</strong></span>
    <form method="post" action="/admin/impersonate/stop" class="inline">
      <button type="submit" class="underline hover:no-underline text-white font-semibold">Stop impersonating</button>
    </form>
  </div>
  <div class="h-9"></div>
  {% endif %}
  {% block body %}{% endblock %}
</body>
</html>
