{% extends "admin/layout.html" %}
{% block admin_title %}Dashboard{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold text-primary mb-6">Dashboard</h1>

<div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
  <div class="bg-surface border border-base rounded-2xl p-5">
    <p class="text-xs font-semibold text-muted uppercase tracking-wider mb-1">Total Users</p>
    <p class="text-3xl font-bold text-primary">{{ stats.total_users }}</p>
  </div>
  <div class="bg-surface border border-base rounded-2xl p-5">
    <p class="text-xs font-semibold text-muted uppercase tracking-wider mb-1">Active Users</p>
    <p class="text-3xl font-bold text-primary">{{ stats.active_users }}</p>
  </div>
  <div class="bg-surface border border-base rounded-2xl p-5">
    <p class="text-xs font-semibold text-muted uppercase tracking-wider mb-1">Total Notes</p>
    <p class="text-3xl font-bold text-primary">{{ stats.total_notes }}</p>
  </div>
</div>

<div class="flex gap-3">
  <a href="/admin/users" class="btn-accent px-4 py-2 rounded-xl text-sm font-semibold">Manage Users</a>
  <a href="/admin/settings" class="bg-surface border border-base text-secondary px-4 py-2 rounded-xl text-sm font-semibold hover:bg-base">Site Settings</a>
  <a href="/admin/oauth" class="bg-surface border border-base text-secondary px-4 py-2 rounded-xl text-sm font-semibold hover:bg-base">OAuth Credentials</a>
</div>
{% endblock %}
